name: Publish public frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned tools
        run: |
          npm ci --ignore-scripts
          bash scripts/install-spec-spine.sh
          echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"
      - name: Verify and build
        run: |
          spec-spine lint --fail-on-warn
          spec-spine check --fail-on-warn --fail-on-unresolved
          spec-spine index coverage --fail-on-untraced
          npm run catalog
          cp public/data/catalog.json .statecraft/state/catalog-first.json
          npm run catalog
          cmp public/data/catalog.json .statecraft/state/catalog-first.json
          npm test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/client
  deploy:
    timeout-minutes: 5
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a superseded commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_sha=$(curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 2 --retry-max-time 70 "https://api.github.com/repos/$REPOSITORY/commits/main" | jq -er .sha)
          test "$current_sha" = "$EXPECTED_SHA"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
